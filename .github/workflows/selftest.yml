name: selftest

# The gate this repo demands of its users: a test that nobody runs does not exist.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly, so rot shows up without a push

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: selftest
        run: python selftest.py
      - name: quickstart from the README must actually work
        shell: bash
        run: |
          python examples/demo_job.py --once
          python -m verified_ops freshness --config examples/verified-ops.json
          python -m verified_ops rollout --config examples/verified-ops.json
